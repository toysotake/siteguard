<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SiteGuard | セキュリティ簡易診断</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e9edf6;background:#101522}*{box-sizing:border-box}body{margin:0}main{max-width:930px;margin:70px auto;padding:24px}.logo{color:#6ee7b7;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(28px,5vw,44px);margin:14px 0}p{color:#aeb9ca;line-height:1.7}.panel{background:#1a2233;border:1px solid #344056;border-radius:18px;padding:24px;margin-top:28px}form{display:flex;gap:10px}input{flex:1;min-width:0;padding:17px;border-radius:10px;border:1px solid #526079;background:#0e1523;color:white;font-size:16px}button{padding:14px 25px;border:0;background:#6ee7b7;color:#07251c;font-weight:800;border-radius:10px;cursor:pointer}button:disabled{opacity:.45}#results{margin-top:20px}article{padding:16px 0;border-bottom:1px solid #344056}article:last-child{border:0}.status{font-size:12px;font-weight:700;padding:4px 9px;border-radius:30px;background:#344056;margin-right:8px}.ok{color:#6ee7b7}.warn{color:#ffcc75}.bad{color:#ff9494}.muted{font-size:13px;color:#9caac1}.score{font-size:35px;font-weight:800}a{color:#87e8d3}@media(max-width:570px){form{flex-direction:column}main{margin:30px auto}}</style></head><body><main><div class="logo">⬡ SITEGUARD / JS</div><h1>Webサイトの安全性を<br>URLひとつで簡易チェック</h1><p>HTTPS、セキュリティヘッダー、Cookie属性、サーバー情報の露出を確認します。公開情報のみを利用し、攻撃的な検査は行いません。</p><div class="panel"><form id="form"><input id="url" type="url" placeholder="https://example.com" required aria-label="診断するURL"><button id="submit">診断する</button></form><p class="muted">※ ご自身が管理するサイト、または診断許可を得たサイトに使用してください。</p><div id="results" aria-live="polite"></div></div><p class="muted">このチェックは安全性を保証するものではありません。PHPやCMSのバージョンは外部から取得できない場合があります。</p></main><script>const endpoint='https://siteguard-api.otake-983.workers.dev';const checks=[['https','HTTPS'],['hsts','HSTS'],['csp','Content Security Policy'],['frame','クリックジャッキング対策'],['nosniff','MIMEスニッフィング対策'],['referrer','Referrer Policy'],['cookies','Cookie属性'],['exposure','サーバー情報の露出']];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),box=document.getElementById('results');button.disabled=true;box.textContent='診断中…';try{const res=await fetch(endpoint+'/api/check?url='+encodeURIComponent(document.getElementById('url').value));const data=await res.json();if(!res.ok)throw Error(data.error||'診断に失敗しました');box.innerHTML='<div class="score">'+data.score+' / 100</div><p class="muted">'+esc(data.finalUrl)+'</p>'+checks.map(([key,title])=>{const c=data.checks[key];return '<article><span class="status '+(c.status==='ok'?'ok':c.status==='warn'?'warn':'bad')+'">'+esc(c.status.toUpperCase())+'</span><strong>'+title+'</strong><p>'+esc(c.message)+'</p></article>'}).join('')+'<p class="muted">HTTP '+data.httpStatus+' · '+new Date(data.checkedAt).toLocaleString('ja-JP')+'</p>'}catch(err){box.textContent=err.message+'。READMEの手順でAPIを起動し、URLを確認してください。'}finally{button.disabled=false}});</script></body></html>
