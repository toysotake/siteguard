<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SiteGuard | セキュリティ簡易診断</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e9edf6;background:#101522}*{box-sizing:border-box}body{margin:0}main{max-width:930px;margin:70px auto;padding:24px}.logo{color:#6ee7b7;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(28px,5vw,44px);margin:14px 0}p{color:#aeb9ca;line-height:1.7}.panel{background:#1a2233;border:1px solid #344056;border-radius:18px;padding:24px;margin-top:28px}form{display:flex;gap:10px}input{flex:1;min-width:0;padding:17px;border-radius:10px;border:1px solid #526079;background:#0e1523;color:white;font-size:16px}button{padding:14px 25px;border:0;background:#6ee7b7;color:#07251c;font-weight:800;border-radius:10px;cursor:pointer}button:disabled{opacity:.45}#results{margin-top:20px}article{padding:16px 0;border-bottom:1px solid #344056}article:last-child{border:0}.advice{background:#101a2a;border:1px solid #344056;border-radius:12px;padding:15px;margin-top:12px}.advice p{margin:7px 0}.advice b{color:#dde8f4}.advice .fix{color:#9fe6d0}.advice small{color:#9caac1}.status{font-size:12px;font-weight:700;padding:4px 9px;border-radius:30px;background:#344056;margin-right:8px}.ok{color:#6ee7b7}.warn{color:#ffcc75}.bad{color:#ff9494}.muted{font-size:13px;color:#9caac1}.score{font-size:35px;font-weight:800}a{color:#87e8d3}.contact{margin:36px 0 10px;padding:30px;text-align:center;background:#1a2233;border:1px solid #344056;border-radius:18px}.contact a{display:inline-block;background:#6ee7b7;color:#07251c;text-decoration:none;padding:16px 30px;border-radius:10px;font-weight:800;margin-top:12px}.tech{padding:18px;margin-top:22px;background:#101a2a;border:1px solid #344056;border-radius:12px}.tech p{margin:10px 0}.tech b{color:#e9edf6}@media(max-width:570px){form{flex-direction:column}main{margin:30px auto}}</style></head><body><main><div class="logo">⬡ SITEGUARD / JS</div><h1>Webサイトの安全性を<br>URLひとつで簡易チェック</h1><p>HTTPS、セキュリティヘッダー、Cookie属性、サーバー情報の露出を確認します。公開情報のみを利用し、攻撃的な検査は行いません。</p><div class="panel"><form id="form"><input id="url" type="url" placeholder="https://example.com" required aria-label="診断するURL"><button id="submit">診断する</button></form><p class="muted">※ ご自身が管理するサイト、または診断許可を得たサイトに使用してください。</p><div id="results" aria-live="polite"></div></div><p class="muted">このチェックは安全性を保証するものではありません。PHPやCMSのバージョンは外部から取得できない場合があります。</p><section class="contact"><h2>Webサイトのセキュリティについて</h2><p>診断結果や改善についてのご相談はこちらから。</p><a href="https://maskman.co.jp/contact" target="_blank" rel="noopener noreferrer">相談はこちらから ↗</a></section></main><script>const endpoint='https://siteguard-api.otake-983.workers.dev';const checks=[['https','HTTPS'],['hsts','HSTS'],['csp','Content Security Policy'],['frame','クリックジャッキング対策'],['nosniff','MIMEスニッフィング対策'],['referrer','Referrer Policy'],['cookies','Cookie属性'],['exposure','サーバー情報の露出']];const guidance={
https:{risk:'通信内容が暗号化されず、盗聴や改ざんのリスクがあります。',fix:'有効なTLS証明書を設定し、HTTPSへ統一してください。HTTPからHTTPSへの転送も設定します。'},
hsts:{risk:'HTTPS接続済みでも、初回接続などでHTTPへ誘導される余地が残ります。',fix:'HTTPSサイトで Strict-Transport-Security を設定します。例: max-age=31536000。サブドメインを含める場合は事前検証してください。'},
csp:{risk:'スクリプトの読み込み元が制限されず、XSS被害を軽減する仕組みが不足する可能性があります。',fix:'Content-Security-Policy をサイト構成に合わせて設定してください。まずReport-Onlyで検証し、script-srcなどを段階的に制限します。'},
frame:{risk:'第三者のページに埋め込まれ、意図しないクリックを誘導される可能性があります。',fix:"CSPの frame-ancestors 'self'（必要なら許可ドメイン）または X-Frame-Options: DENY / SAMEORIGIN を設定します。"},
nosniff:{risk:'ブラウザによるコンテンツ形式の推測が、想定外の実行につながる場合があります。',fix:'X-Content-Type-Options: nosniff を設定し、各リソースのContent-Typeも正しく返してください。'},
referrer:{risk:'外部リンク先へページURLなどが意図以上に送信される可能性があります。',fix:'Referrer-Policy: strict-origin-when-cross-origin など、用途に合うポリシーを設定してください。'},
cookies:{risk:'セッションCookieの属性が不足すると、盗聴やスクリプトからの参照、クロスサイト送信のリスクが増えます。',fix:'認証用CookieにSecure、HttpOnly、適切なSameSite属性を設定してください。複数Cookieはサーバー側で個別に確認します。'},
exposure:{risk:'サーバー製品やバージョン情報が公開されると、攻撃者の調査材料になる場合があります。',fix:'不要なServer・X-Powered-Byなどのバージョン露出を抑えてください。ソフトウェア自体の更新も必要です。'}
};const techInfo=data=>{const t=data.technologies||{};return '<section class="tech"><h2>追加の技術情報</h2><p class="muted">外部から確認できる公開情報のみを表示します。</p>'+[['tls','SSL / TLS'],['cms','CMS'],['php','PHP']].map(([key,label])=>'<p><b>'+label+'</b></p><p>'+esc(t[key]?.message||'未確認（Worker側に追加診断コードの反映が必要です）')+'</p>').join('')+'</section>'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),box=document.getElementById('results');button.disabled=true;box.textContent='診断中…';try{const res=await fetch(endpoint+'/api/check?url='+encodeURIComponent(document.getElementById('url').value));const data=await res.json();if(!res.ok)throw Error(data.error||'診断に失敗しました');box.innerHTML='<div class="score">'+(Number.isFinite(data.score)?data.score+' / 100':'スコア未算出')+'</div><p class="muted">'+esc(data.finalUrl)+'</p>'+checks.map(([key,title])=>{const c=data.checks[key];return '<article><span class="status '+(c.status==='ok'?'ok':c.status==='warn'?'warn':'bad')+'">'+esc(c.status.toUpperCase())+'</span><strong>'+title+'</strong><p>'+esc(c.message)+'</p>'+(c.status==='ok'?'':'<div class="advice"><p><b>懸念される点</b></p><p>'+esc(guidance[key].risk)+'</p><p class="fix"><b>改善方法</b></p><p>'+esc(guidance[key].fix)+'</p></div>')+'</article>'}).join('')+techInfo(data)+'<p class="muted">HTTP '+data.httpStatus+' · '+new Date(data.checkedAt).toLocaleString('ja-JP')+'</p>'}catch(err){box.textContent=err.message+'。READMEの手順でAPIを起動し、URLを確認してください。'}finally{button.disabled=false}});</script></body></html>
